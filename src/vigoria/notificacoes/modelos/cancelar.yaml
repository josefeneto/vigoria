# Deixar de receber lembretes (Fase 8; prazo da ligação na Fase 10). Textos aprovados pelo
# José a 07/11/2026, exceto «expirada» (Fase 10, 12/11/2026). Usados pela página Streamlit da
# demo (paginas/textos.py, CANCELAR_*) e pelo serviço de produção (vigoria/web/cancelar.py).
# {dias}: a validade da ligação (notificacoes/token.py, VALIDADE).
titulo: Lembretes por email
pergunta: >-
  Quer deixar de receber os lembretes por email da Vigoria? O seu plano e os seus registos
  ficam como estão.
botao: Deixar de receber lembretes
feito: "Pronto: já não vai receber lembretes por email."
reativar: Pode voltar a ativá-los em «A minha conta».
invalida: >-
  Esta ligação não é válida ou já não corresponde a nenhuma conta. Se ainda recebe lembretes,
  pode desativá-los em «A minha conta».
expirada: >-
  Esta ligação expirou: as ligações dos emails valem {dias} dias. Se ainda recebe lembretes,
  pode desativá-los em «A minha conta».
inicio: Ir para o Início
