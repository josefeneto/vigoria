<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$assunto</title>
</head>
<body style="margin:0;padding:0;background:$cor_fundo;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:$cor_fundo;">
<tr><td align="center" style="padding:24px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:$cor_cartao;border:1px solid $cor_borda;border-radius:12px;">
<tr><td style="padding:24px 24px 8px 24px;font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700;color:$cor_principal_profundo;">
<img src="$url_logotipo" width="32" height="32" alt="" style="vertical-align:middle;border:0;margin-right:8px;">Vigoria
</td></tr>
<tr><td style="padding:8px 24px;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.5;color:$cor_texto;">
<p style="margin:0 0 12px 0;">$saudacao</p>
<p style="margin:0 0 12px 0;">$corpo</p>
$ultimo_html
</td></tr>
<tr><td style="padding:8px 24px 24px 24px;">
<a href="$url_registo" style="display:inline-block;background:$cor_principal;color:$cor_branco;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;text-decoration:none;padding:14px 24px;border-radius:8px;">$botao</a>
</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
<tr><td style="padding:16px 8px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:$cor_texto_secundario;">
<p style="margin:0 0 6px 0;">$rodape_motivo</p>
<p style="margin:0 0 6px 0;"><a href="$url_cancelar" style="color:$cor_principal;">$rodape_cancelar</a></p>
<p style="margin:0;">$rodape_reativar</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
