# Dança (opcional), REGRAS_DOMINIO §5.1 (D1 a D7, decisão de 17/11/2026).
# Ligações escolhidas pelo José (documento «Aerobic_Dance_Zumba_etc»). Classificação:
# «Esforço Mínimo» → ligeira; «Esforço Médio» → media; «Esforço Normal» → alta;
# «Esforço Misto» → mais_aulas (só para media e alta, sem restrição por condições).
# A CONFIRMAR (revisão profissional): a classificação dos níveis.
# Confirmar as ligações: python scripts/verificar_links_danca.py (atualiza à mão verificado_em).
# Os vídeos abrem no YouTube numa janela nova; nada fica embutido na app (D7).

textos:
  titulo: Dança (opcional)
  dias_cardio: >-
    Nos dias de cardio, pode trocar o cardio pela dança. Não acrescente dança aos dias de
    descanso.
  dias_sem_cardio: >-
    Pode dançar nos dias de caminhada leve, em vez da caminhada. O domingo fica para
    descanso.
  minutos: "{n} minutos de dança"
  estrutura: >-
    Comece pelo aquecimento do treino, dance e termine com o retorno à calma do treino.
  danca: Dança
  sem_saltos: >-
    Sem saltos: acompanhe com passos no chão e use os braços para dar intensidade. Se sentir
    dor ou falta de ar, pare.
  ajuste: Deve conseguir falar, mas não cantar (esforço 3 a 6 em 10).
  ajuste_subir: Se for fácil demais, experimente o nível acima na semana seguinte.
  registo: Os minutos de dança contam como minutos de cardio no registo semanal.
  ligacoes: Vídeos para dançar
  mais_calmo: Para um dia mais calmo
  mais_aulas: Mais aulas
  abre_youtube: Abre no YouTube, numa janela nova.

