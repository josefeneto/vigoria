# Tai Chi (opcional), REGRAS_DOMINIO §5.2 (T1 a T7, decisão de 18/11/2026).
# Ligações escolhidas pelo José (docs/referencia/TaiChi-youtube-videos.pdf). Classificação:
# «Esforço Mínimo» → ligeira (Tai Chi na cadeira); «Esforço Médio» → media;
# «Esforço Normal» → alta. Sem «Mais aulas».
# Títulos em PT-PT, neutros e sem promessas (os originais prometem cintura e barriga).
# A CONFIRMAR (revisão profissional): a classificação dos níveis.
# Confirmar as ligações: python scripts/verificar_links_danca.py (atualiza à mão verificado_em).
# Os vídeos abrem no YouTube numa janela nova; nada fica embutido na app (T7).

textos:
  titulo: Tai Chi (opcional)
  dias_sem_treino: >-
    Nos dias sem treino, pode fazer Tai Chi antes ou depois da caminhada leve (ou da dança, se
    dançar nesse dia).
  dias_treino: >-
    Nos dias de treino, pode fazer Tai Chi em vez do retorno à calma, com a mesma duração.
  minutos: "{n} minutos de Tai Chi"
  estrutura: >-
    Comece com um aquecimento curto, faça Tai Chi e termine com o retorno à calma do treino.
  aquecimento: >-
    Aquecimento curto: rode devagar as articulações, dos ombros aos tornozelos, e respire
    fundo algumas vezes.
  taichi: Tai Chi
  postura: >-
    Movimentos lentos e postura alta: joelhos ligeiramente fletidos, sem descer. Se perder o
    equilíbrio, apoie-se numa cadeira ou parede.
  nao_cardio: O Tai Chi não conta como minutos de cardio no registo semanal.
  ligacoes: Vídeos de Tai Chi
  mais_calmo: Para um dia mais calmo
  abre_youtube: Abre no YouTube, numa janela nova.

