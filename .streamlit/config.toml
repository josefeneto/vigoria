[theme]
base = "light"
primaryColor = "#1F5C63"            # petróleo
backgroundColor = "#F7F3EC"         # branco-osso
secondaryBackgroundColor = "#ECE5D8"
textColor = "#2E3338"               # grafite
font = "sans serif"
baseFontSize = 17                   # público 45+: letra base de pelo menos 17 px

[server]
headless = true                     # obrigatório no Community Cloud e no Docker; em local, abrir http://localhost:8501
# Sem port nem address: ficam os valores por omissão (8501, todas as interfaces).

[client]
toolbarMode = "minimal"                # sem o botão «Deploy» e opções de programador

[browser]
gatherUsageStats = false
