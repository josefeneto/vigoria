# Lembretes de registo por email (Fase 8) — SÓ EXECUÇÃO MANUAL, para a demo.
#
# Fase 10B (12/11/2026): o envio diário passou para o serviço cron do Railway
# (docs/GUIA_PRODUCAO.md). Este workflow ficou só com «Run workflow» (workflow_dispatch) para
# testar a demo à mão (simular, envio de teste), com os segredos da demo. Sem «schedule», o
# GitHub deixa de tratar emails sem ninguém o pedir e não há dois envios diários.
#
# Os registos deste workflow podem ser públicos: a tarefa só escreve identificadores técnicos,
# nunca emails nem dados de saúde.
name: Lembretes por email (manual, demo)

on:
  workflow_dispatch:
    inputs:
      simular:
        description: "Só mostrar quem receberia que lembrete, sem enviar nem gravar"
        type: boolean
        default: true
      testar_envio:
        description: "Mandar já um lembrete de exemplo (sem regras nem gravação) a quem está na lista"
        type: boolean
        default: false
      utilizador:
        description: "Com o envio de teste: id do utilizador, se houver mais de um (vazio = o único)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: lembretes
  cancel-in-progress: false

jobs:
  lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Enviar os lembretes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          VIGORIA_SEGREDO_LEMBRETES: ${{ secrets.VIGORIA_SEGREDO_LEMBRETES }}
          VIGORIA_EMAILS_PERMITIDOS: ${{ secrets.VIGORIA_EMAILS_PERMITIDOS }}
          # Sem a variável, «demo»: só quem está na lista de convidados (falha fechada).
          AMBIENTE: ${{ vars.AMBIENTE || 'demo' }}
          APP_URL: ${{ vars.APP_URL }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE || 'geral@vigoria.pt' }}
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular }}
          TESTAR_ENVIO: ${{ github.event_name == 'workflow_dispatch' && inputs.testar_envio }}
          UTILIZADOR: ${{ inputs.utilizador }}
        run: |
          opcoes=()
          if [ "$SIMULAR" = "true" ]; then opcoes+=(--simular); fi
          if [ "$TESTAR_ENVIO" = "true" ]; then
            opcoes+=(--testar-envio)
            if [ -n "$UTILIZADOR" ]; then opcoes+=(--utilizador "$UTILIZADOR"); fi
          fi
          python -m vigoria.tarefas.lembretes "${opcoes[@]}"
